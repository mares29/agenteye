<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        width: 200px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0b0b0e;
        color: #f0f0f0;
        padding: 14px 16px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .label {
        font-size: 13px;
        font-weight: 600;
      }
      .switch {
        position: relative;
        width: 40px;
        height: 22px;
        cursor: pointer;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        inset: 0;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 11px;
        transition: background 0.2s;
      }
      .slider::before {
        content: "";
        position: absolute;
        width: 16px;
        height: 16px;
        left: 3px;
        top: 3px;
        background: #f0f0f0;
        border-radius: 50%;
        transition: transform 0.2s;
      }
      .switch input:checked + .slider {
        background: #e6d520;
      }
      .switch input:checked + .slider::before {
        transform: translateX(18px);
      }
    </style>
  </head>
  <body>
    <div class="row">
      <span class="label">AgentEye</span>
      <label class="switch" id="toggle">
        <input type="checkbox" />
        <span class="slider"></span>
      </label>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
