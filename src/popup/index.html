<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        width: 200px;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0b0b0e;
        color: #f0f0f0;
        padding: 14px 16px;
      }
      .row {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .label {
        font-size: 13px;
        font-weight: 600;
      }
      .switch {
        position: relative;
        width: 40px;
        height: 22px;
        cursor: pointer;
      }
      .switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }
      .slider {
        position: absolute;
        inset: 0;
        background: rgba(255, 255, 255, 0.12);
        border-radius: 11px;
        transition: background 0.2s;
      }
      .slider::before {
        content: "";
        position: absolute;
        width: 16px;
        height: 16px;
        left: 3px;
        top: 3px;
        background: #f0f0f0;
        border-radius: 50%;
        transition: transform 0.2s;
      }
      .switch input:checked + .slider {
        background: #ffffff;
      }
      .switch input:checked + .slider::before {
        transform: translateX(18px);
        background: #0b0b0e;
      }
      .coffee {
        display: flex;
        flex-direction: column;
        align-items: center;
      }
      .divider {
        width: 100%;
        height: 1px;
        background: rgba(255, 255, 255, 0.08);
        margin: 12px 0;
      }
      .coffee-text {
        font-size: 11px;
        color: rgba(240, 240, 240, 0.45);
        text-align: center;
        margin-bottom: 10px;
      }
      .qr {
        width: 120px;
        height: 120px;
        border-radius: 8px;
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <div class="row">
      <span class="label">AgentEye</span>
      <label class="switch" id="toggle">
        <input type="checkbox" />
        <span class="slider"></span>
      </label>
    </div>
    <div class="coffee">
      <div class="divider"></div>
      <p class="coffee-text">Enjoying AgentEye?<br/>Buy me a coffee</p>
      <img src="../icons/qr-coffee.png" alt="Buy me a coffee" class="qr" />
    </div>
    <script src="popup.js"></script>
  </body>
</html>
